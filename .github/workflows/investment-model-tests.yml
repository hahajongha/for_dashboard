# 회귀 테스트 — 현재 코드 + v1.0 고정 데이터(tests/fixtures)로 골든 테스트와 JS·Python 주문 엔진 일치 테스트.
name: Investment model tests
on:
  push:
    paths:
      - "investment_model/qpm/**"
      - "investment_model/config/**"
      - "investment_model/dashboard/**"
      - "investment_model/scripts/**"
      - "investment_model/tests/**"
      - "investment_model/requirements.lock"
      - ".github/workflows/investment-model-tests.yml"
  pull_request:
    paths:
      - "investment_model/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: investment_model/requirements.lock
      - run: pip install -r investment_model/requirements.lock
      - name: Golden + parity tests
        run: python investment_model/scripts/golden_ci.py
