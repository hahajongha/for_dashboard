# 재사용 워크플로 — update-investment-data.yml(수동)과 investment-model-monthly.yml(예약)이 호출합니다.
# 실행: investment_model/scripts/ci_run.py (임시 복사본에서 업데이트 → 가드 → 검증 → 모델 → 통과 시에만 교체)
name: Investment model pipeline (reusable)
on:
  workflow_call:
    inputs:
      task:   { type: string, required: true }
      as_of:  { type: string, required: false, default: "" }
      force:  { type: boolean, required: false, default: false }

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: investment_model/requirements.lock

      - name: Install dependencies (pinned)
        run: pip install -r investment_model/requirements.lock

      - name: Run pipeline
        id: pipeline
        continue-on-error: true
        env:
          TASK: ${{ inputs.task }}
          AS_OF: ${{ inputs.as_of }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(--task "$TASK" --as-of "$AS_OF")
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python investment_model/scripts/ci_run.py "${args[@]}"

      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("investment_model/output/status.json", encoding="utf-8"))
          print(f"### TAA 데이터 업데이트: {s['status']}")
          print(f"- {s.get('message','')}")
          for k in ("as_of", "market_data_date", "macro_data_date"):
              print(f"- {k}: {s.get(k)}")
          g = s.get("guards") or {}
          for i in (g.get("items") or [])[:30]:
              print(f"- guard {i['level']} [{i['area']}] {i['msg']}")
          PY

      # 성공 시: data/·history/·output/ 교체분 + status.json, 실패 시: status.json 만 바뀌어 있음
      - name: Commit and push
        env:
          BRANCH: ${{ github.ref_name }}   # dispatch는 기본 브랜치에서만 허용, schedule은 항상 기본 브랜치
          TASK: ${{ inputs.task }}
          OUTCOME: ${{ steps.pipeline.outcome }}
        run: >
          bash investment_model/scripts/ci_commit.sh "$BRANCH"
          "chore: update investment model ($TASK, $OUTCOME, $(date -u +'%Y-%m-%d %H:%M UTC'))"

      # GITHUB_TOKEN push는 Pages 빌드를 자동으로 시작하지 않을 수 있어 명시적으로 요청
      - name: Request GitHub Pages build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" -o /dev/null -w "pages build request: %{http_code}\n"

      - name: Fail job if pipeline failed
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::error::파이프라인 실패 — 기존 데이터는 유지되었습니다 (investment_model/output/status.json 참고)"
          exit 1
