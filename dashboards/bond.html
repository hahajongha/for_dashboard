<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>금융시장 대시보드</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --up: #c92c2c;      /* 상승 (국내 관행: 빨강) */
  --down: #1c5cab;    /* 하락 (국내 관행: 파랑) */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --s4: #eda100; --s5: #e87ba4; --s6: #008300;
  --spark: #c3c2b7;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255,255,255,0.10);
  --up: #e66767;
  --down: #6da7ec;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --s4: #c98500; --s5: #d55181; --s6: #008300;
  --spark: #52514e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --up: #e66767;
    --down: #6da7ec;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --s4: #c98500; --s5: #d55181; --s6: #008300;
    --spark: #52514e;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 20px 48px; }
header.top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 8px 0 18px; }
header.top h1 { font-size: 21px; font-weight: 700; margin: 0; }
.asof { color: var(--ink-2); font-size: 13px; }
.spacer { flex: 1; }
.theme-btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
  border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer;
}
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 18px; margin-bottom: 16px;
}
.card h2 { font-size: 15px; font-weight: 700; margin: 0 0 4px; }
.card .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.tile .lbl { color: var(--ink-2); font-size: 12px; }
.tile .val { font-size: 24px; font-weight: 600; margin: 2px 0 0; }
.tile .val small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 2px; }
.tile .delta { font-size: 12px; margin-top: 2px; }
.tile .delta .dir-up { color: var(--up); }
.tile .delta .dir-down { color: var(--down); }
.tile .delta .dir-flat { color: var(--muted); }
.tile svg { display: block; margin-top: 8px; width: 100%; height: 30px; }

/* tabs & filters */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tabs button {
  border: 1px solid var(--border); background: transparent; color: var(--ink-2);
  border-radius: 8px; padding: 4px 12px; font-size: 13px; cursor: pointer;
}
.tabs button[aria-pressed="true"] { background: var(--s1); border-color: var(--s1); color: #fff; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.filters label { color: var(--ink-2); font-size: 12px; }
.filters select, .filters input[type="search"] {
  background: var(--surface); color: var(--ink); border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 8px; font-size: 13px;
}
.series-picker { position: relative; }
.series-pop {
  position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; width: 320px; max-height: 320px;
  overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.18); padding: 8px;
}
.series-pop[hidden] { display: none; }
.series-pop label.row { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 6px; font-size: 13px; color: var(--ink); cursor: pointer; }
.series-pop label.row:hover { background: var(--grid); }
.series-pop .cat { color: var(--muted); font-size: 11px; margin: 6px 6px 2px; text-transform: uppercase; letter-spacing: .04em; }
.hint { color: var(--muted); font-size: 12px; }

/* legend */
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 6px 0 2px; font-size: 12px; color: var(--ink-2); }
.legend .key { display: inline-flex; align-items: center; gap: 6px; }
.legend .key i { display: inline-block; width: 14px; height: 0; border-top: 2.5px solid currentColor; border-radius: 2px; }

.chart-box { position: relative; }
.chart-box svg { display: block; width: 100%; height: auto; }
.tooltip {
  position: absolute; pointer-events: none; z-index: 20; min-width: 150px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.16); padding: 8px 10px; font-size: 12px;
  display: none;
}
.tooltip .tt-date { color: var(--muted); margin-bottom: 4px; }
.tooltip .tt-row { display: flex; align-items: center; gap: 7px; margin: 2px 0; }
.tooltip .tt-row i { display: inline-block; width: 12px; height: 0; border-top: 2.5px solid currentColor; border-radius: 2px; flex: none; }
.tooltip .tt-row b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tooltip .tt-row span { color: var(--ink-2); }

/* table */
.table-scroll { overflow-x: auto; }
table.data { border-collapse: collapse; width: 100%; font-size: 13px; }
table.data th, table.data td { padding: 6px 10px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.data th { color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--axis); position: sticky; top: 0; background: var(--surface); }
table.data td:first-child, table.data th:first-child { text-align: left; }
table.data td:first-child { color: var(--ink); }
table.data td .code { color: var(--muted); font-size: 11px; margin-left: 6px; }
table.data tbody tr { border-bottom: 1px solid var(--grid); }
table.data tbody tr:hover { background: var(--grid); }
td.up { color: var(--up); } td.down { color: var(--down); } td.flat { color: var(--muted); }
footer { color: var(--muted); font-size: 12px; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="theme-btn" id="homeBtn" href="../" hidden style="text-decoration:none">◀ 바탕화면</a>
    <h1>금융시장 대시보드</h1>
    <span class="asof" id="asof">불러오는 중…</span>
    <span class="spacer"></span>
    <button class="theme-btn" id="themeBtn" type="button">테마 전환</button>
  </header>

  <div class="kpis" id="kpis"></div>

  <section class="card">
    <h2>수익률곡선</h2>
    <div class="sub" id="curveSub"></div>
    <div class="tabs" id="curveTabs" role="tablist"></div>
    <div class="legend" id="curveLegend"></div>
    <div class="chart-box" id="curveBox"></div>
  </section>

  <section class="card">
    <h2>시계열 추이</h2>
    <div class="sub">시리즈를 선택해 최근 흐름을 비교합니다 (최대 6개)</div>
    <div class="filters">
      <div class="tabs" id="rangeTabs" role="tablist" style="margin:0"></div>
      <div class="series-picker">
        <button class="theme-btn" id="pickerBtn" type="button" aria-expanded="false">시리즈 선택 ▾</button>
        <div class="series-pop" id="seriesPop" hidden>
          <input type="search" id="seriesSearch" placeholder="검색 (예: UST, 회사채, 환율)" style="width:100%;margin-bottom:6px">
          <div id="seriesList"></div>
        </div>
      </div>
      <span class="hint" id="pickedHint"></span>
    </div>
    <div class="legend" id="tsLegend"></div>
    <div class="chart-box" id="tsBox"></div>
  </section>

  <section class="card">
    <h2>전체 시리즈 현황</h2>
    <div class="sub">최신값과 변화폭 — 금리성 지표는 bp, 환율·지수는 % 기준</div>
    <div class="filters">
      <div class="tabs" id="catTabs" role="tablist" style="margin:0"></div>
      <input type="search" id="tableSearch" placeholder="시리즈 검색">
    </div>
    <div class="table-scroll" style="max-height:520px;overflow-y:auto">
      <table class="data" id="dataTable">
        <thead><tr>
          <th>시리즈</th><th>최신값</th><th>기준일</th>
          <th>1D</th><th>1W</th><th>1M</th><th>3M</th><th>YTD</th><th>1Y</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
"use strict";
/* 단독으로 열렸을 때(데스크톱 창 iframe이 아닐 때)만 바탕화면 링크 표시 */
try { if (window.top === window.self) document.getElementById("homeBtn").hidden = false; } catch (e) {}
/* ---------- 테마 ---------- */
(function () {
  let saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  if (saved === "dark" || saved === "light") document.documentElement.dataset.theme = saved;
  document.getElementById("themeBtn").addEventListener("click", () => {
    const cur = document.documentElement.dataset.theme ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch (e) {}
    render(); // 차트 색 재적용
  });
})();

const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const SERIES_COLORS = () => [css("--s1"), css("--s2"), css("--s3"), css("--s4"), css("--s5"), css("--s6")];
const CAT_LABEL = { RATE: "금리", FX: "환율", CREDIT: "크레딧", HEDGE: "헤지 프리미엄", MACRO: "변동성", OTHER: "기타" };
const svgNS = "http://www.w3.org/2000/svg";

let DB = null;             // dashboard_data.json
let byId = {};             // series id -> meta
let curveKey = "KR";
let rangeDays = 365;       // 기간 프리셋
let picked = [];           // 선택된 시리즈 id
let catFilter = "ALL";

const fmt = (v, digits = 2) =>
  v == null ? "–" : Number(v).toLocaleString("ko-KR", { minimumFractionDigits: digits, maximumFractionDigits: digits });

function deltaText(v, unit) {
  if (v == null) return { txt: "–", cls: "flat" };
  const sign = v > 0 ? "+" : "";
  const cls = v > 0 ? "up" : v < 0 ? "down" : "flat";
  const digits = unit === "bp" ? 1 : 2;
  return { txt: `${sign}${fmt(v, digits)}${unit}`, cls };
}

function el(tag, attrs, parent) {
  const n = attrs && attrs.__svg ? document.createElementNS(svgNS, tag) : document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === "__svg") continue;
    if (k === "text") n.textContent = v;
    else n.setAttribute(k, v);
  }
  if (parent) parent.appendChild(n);
  return n;
}
const svgEl = (tag, attrs, parent) => el(tag, Object.assign({ __svg: 1 }, attrs), parent);

function niceTicks(min, max, count = 5) {
  if (!(isFinite(min) && isFinite(max))) return [];
  if (min === max) { min -= 1; max += 1; }
  const span = max - min;
  const step0 = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const norm = step0 / mag;
  const step = (norm >= 5 ? 5 : norm >= 2.5 ? 2.5 : norm >= 2 ? 2 : 1) * mag;
  const lo = Math.ceil(min / step) * step;
  const ticks = [];
  for (let v = lo; v <= max + 1e-9; v += step) ticks.push(+v.toFixed(10));
  return ticks;
}

/* ---------- 라인 차트 (crosshair + 전 시리즈 툴팁) ---------- */
function lineChart(box, opts) {
  // opts: {xLabels[], series:[{label,color,values[],width?,dash?}], height, yFmt, xTickEvery, tooltipTitle(i)}
  box.textContent = "";
  const W = 1080, H = opts.height || 340;
  const pad = { l: 52, r: 16, t: 12, b: 26 };
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const n = opts.xLabels.length;

  let lo = Infinity, hi = -Infinity;
  for (const s of opts.series) for (const v of s.values)
    if (v != null) { if (v < lo) lo = v; if (v > hi) hi = v; }
  if (!isFinite(lo)) { lo = 0; hi = 1; }
  const padY = (hi - lo) * 0.06 || 0.5;
  lo -= padY; hi += padY;

  const X = (i) => pad.l + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw);
  const Y = (v) => pad.t + ih - ((v - lo) / (hi - lo)) * ih;

  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" }, box);

  for (const t of niceTicks(lo, hi, 5)) {
    svgEl("line", { x1: pad.l, x2: W - pad.r, y1: Y(t), y2: Y(t), stroke: css("--grid"), "stroke-width": 1 }, svg);
    svgEl("text", { x: pad.l - 8, y: Y(t) + 4, "text-anchor": "end", "font-size": 11, fill: css("--muted") }, svg)
      .textContent = opts.yFmt ? opts.yFmt(t) : fmt(t, 2);
  }
  svgEl("line", { x1: pad.l, x2: W - pad.r, y1: pad.t + ih, y2: pad.t + ih, stroke: css("--axis"), "stroke-width": 1 }, svg);

  const every = opts.xTickEvery || Math.max(1, Math.ceil(n / 8));
  for (let i = 0; i < n; i += every) {
    svgEl("text", { x: X(i), y: H - 8, "text-anchor": "middle", "font-size": 11, fill: css("--muted") }, svg)
      .textContent = opts.xLabels[i];
  }

  for (const s of opts.series) {
    let d = "", pen = false;
    s.values.forEach((v, i) => {
      if (v == null) { pen = false; return; }
      d += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1);
      pen = true;
    });
    if (d) svgEl("path", {
      d, fill: "none", stroke: s.color, "stroke-width": s.width || 2,
      "stroke-linejoin": "round", "stroke-linecap": "round",
      ...(s.dash ? { "stroke-dasharray": s.dash } : {})
    }, svg);
    // 끝점 마커: surface 링 + 시리즈 색
    for (let i = s.values.length - 1; i >= 0; i--) {
      if (s.values[i] != null) {
        svgEl("circle", { cx: X(i), cy: Y(s.values[i]), r: 4.5, fill: s.color, stroke: css("--surface"), "stroke-width": 2 }, svg);
        break;
      }
    }
  }

  // crosshair + 툴팁
  const cross = svgEl("line", { y1: pad.t, y2: pad.t + ih, stroke: css("--axis"), "stroke-width": 1, visibility: "hidden" }, svg);
  const dots = opts.series.map((s) =>
    svgEl("circle", { r: 4.5, fill: s.color, stroke: css("--surface"), "stroke-width": 2, visibility: "hidden" }, svg));
  const tip = el("div", { class: "tooltip" }, box);

  function onMove(ev) {
    const r = svg.getBoundingClientRect();
    const px = ((ev.clientX - r.left) / r.width) * W;
    let i = Math.round(((px - pad.l) / iw) * (n - 1));
    i = Math.max(0, Math.min(n - 1, i));
    const x = X(i);
    cross.setAttribute("x1", x); cross.setAttribute("x2", x);
    cross.setAttribute("visibility", "visible");
    tip.style.display = "block";
    tip.textContent = "";
    el("div", { class: "tt-date", text: opts.tooltipTitle ? opts.tooltipTitle(i) : opts.xLabels[i] }, tip);
    opts.series.forEach((s, k) => {
      const v = s.values[i];
      if (v == null) { dots[k].setAttribute("visibility", "hidden"); }
      else {
        dots[k].setAttribute("cx", x); dots[k].setAttribute("cy", Y(v));
        dots[k].setAttribute("visibility", "visible");
      }
      const row = el("div", { class: "tt-row" }, tip);
      el("i", { style: `color:${s.color}` }, row);
      el("b", { text: v == null ? "–" : fmt(v, opts.tipDigits ?? 2) }, row);
      el("span", { text: s.label }, row);
    });
    const bx = box.getBoundingClientRect();
    const tx = ((x / W) * bx.width);
    tip.style.left = Math.min(bx.width - tip.offsetWidth - 6, Math.max(6, tx + 14)) + "px";
    tip.style.top = "10px";
  }
  function onLeave() {
    cross.setAttribute("visibility", "hidden");
    dots.forEach((d) => d.setAttribute("visibility", "hidden"));
    tip.style.display = "none";
  }
  svg.addEventListener("pointermove", onMove);
  svg.addEventListener("pointerleave", onLeave);
}

/* ---------- KPI 타일 ---------- */
function renderKpis() {
  const host = document.getElementById("kpis");
  host.textContent = "";
  for (const id of DB.kpis) {
    const s = byId[id];
    if (!s) continue;
    const tile = el("div", { class: "tile" }, host);
    el("div", { class: "lbl", text: displayName(s) }, tile);
    const val = el("div", { class: "val" }, tile);
    val.appendChild(document.createTextNode(fmt(s.latest, s.unit === "%" ? 2 : 2)));
    if (s.unit === "%") el("small", { text: "%" }, val);
    const d = deltaText(s.chg_1d, s.chg_unit);
    const delta = el("div", { class: "delta" }, tile);
    el("span", { class: "dir-" + (d.cls === "up" ? "up" : d.cls === "down" ? "down" : "flat"), text: d.txt + " (1D)" }, delta);
    // 스파크라인: 최근 40 관측치, de-emphasis 회색 + 끝점 accent
    const vals = (DB.values[id] || []).filter((v) => v != null).slice(-40);
    if (vals.length > 1) {
      const w = 150, h = 30, lo = Math.min(...vals), hi = Math.max(...vals);
      const yy = (v) => hi === lo ? h / 2 : 3 + (h - 6) * (1 - (v - lo) / (hi - lo));
      const xx = (i) => (i / (vals.length - 1)) * (w - 6) + 3;
      const svg = svgEl("svg", { viewBox: `0 0 ${w} ${h}`, "aria-hidden": "true" }, tile);
      svgEl("path", {
        d: vals.map((v, i) => (i ? "L" : "M") + xx(i).toFixed(1) + " " + yy(v).toFixed(1)).join(""),
        fill: "none", stroke: css("--spark"), "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round"
      }, svg);
      svgEl("circle", { cx: xx(vals.length - 1), cy: yy(vals[vals.length - 1]), r: 3.5, fill: css("--s1"), stroke: css("--surface"), "stroke-width": 2 }, svg);
    }
  }
}

function displayName(s) {
  if (s.ticker && /[가-힣]/.test(s.ticker)) return s.ticker.replace(/_/g, " ");
  return s.code.replace(/_/g, " ");
}

/* ---------- 수익률곡선 ---------- */
function renderCurveTabs() {
  const tabs = document.getElementById("curveTabs");
  tabs.textContent = "";
  for (const [key, c] of Object.entries(DB.curves)) {
    const b = el("button", { type: "button", "aria-pressed": String(key === curveKey), text: c.label }, tabs);
    b.addEventListener("click", () => { curveKey = key; renderCurve(); renderCurveTabs(); });
  }
}
function renderCurve() {
  const c = DB.curves[curveKey];
  const box = document.getElementById("curveBox");
  const colors = [css("--s1"), css("--muted"), css("--axis")];
  const widths = [2.5, 2, 2];
  const legend = document.getElementById("curveLegend");
  legend.textContent = "";
  c.snapshots.forEach((snap, i) => {
    const k = el("span", { class: "key" }, legend);
    el("i", { style: `color:${colors[i]}` }, k);
    k.appendChild(document.createTextNode(`${snap.name} (${snap.date || "–"})`));
  });
  document.getElementById("curveSub").textContent =
    `${c.label} — 테너별 금리 수준 (%) · 최신 vs 1개월 전 vs 1년 전`;
  lineChart(box, {
    xLabels: c.tenors,
    xTickEvery: 1,
    height: 320,
    tipDigits: 3,
    series: c.snapshots.map((snap, i) => ({
      label: snap.name, color: colors[i], width: widths[i],
      dash: i === 2 ? "5 4" : null, values: snap.values,
    })),
    tooltipTitle: (i) => `${c.label} ${c.tenors[i]}`,
  });
}

/* ---------- 시계열 ---------- */
const RANGES = [["1M", 31], ["3M", 92], ["6M", 183], ["1Y", 365], ["3Y", 99999]];
function renderRangeTabs() {
  const tabs = document.getElementById("rangeTabs");
  tabs.textContent = "";
  for (const [lbl, days] of RANGES) {
    const b = el("button", { type: "button", "aria-pressed": String(days === rangeDays), text: lbl }, tabs);
    b.addEventListener("click", () => { rangeDays = days; renderRangeTabs(); renderTs(); });
  }
}
function renderSeriesPicker() {
  const listHost = document.getElementById("seriesList");
  const q = document.getElementById("seriesSearch").value.trim().toLowerCase();
  listHost.textContent = "";
  const groups = {};
  for (const s of DB.series) {
    const hay = (s.code + " " + s.ticker).toLowerCase();
    if (q && !hay.includes(q)) continue;
    (groups[s.category] = groups[s.category] || []).push(s);
  }
  for (const [cat, arr] of Object.entries(groups)) {
    el("div", { class: "cat", text: CAT_LABEL[cat] || cat }, listHost);
    for (const s of arr) {
      const row = el("label", { class: "row" }, listHost);
      const cb = el("input", { type: "checkbox" }, row);
      cb.checked = picked.includes(s.id);
      cb.addEventListener("change", () => {
        if (cb.checked) {
          if (picked.length >= 6) { cb.checked = false; return; } // 최대 6개 (팔레트 한도)
          picked.push(s.id);
        } else picked = picked.filter((x) => x !== s.id);
        renderTs();
        document.getElementById("pickedHint").textContent = `${picked.length}/6 선택됨`;
      });
      row.appendChild(document.createTextNode(displayName(s)));
      el("span", { class: "code", text: s.code !== displayName(s).replace(/ /g, "_") ? s.code : "", style: "color:var(--muted);font-size:11px;margin-left:6px" }, row);
    }
  }
}
function renderTs() {
  const box = document.getElementById("tsBox");
  const legend = document.getElementById("tsLegend");
  legend.textContent = "";
  const colors = SERIES_COLORS();
  const nAll = DB.dates.length;
  const from = Math.max(0, nAll - Math.min(rangeDays, nAll));
  const dates = DB.dates.slice(from);
  const shown = picked.map((id, i) => ({
    id, meta: byId[id], color: colors[i % colors.length],
    values: (DB.values[id] || []).slice(from),
  }));
  if (shown.length >= 2) {
    for (const s of shown) {
      const k = el("span", { class: "key" }, legend);
      el("i", { style: `color:${s.color}` }, k);
      k.appendChild(document.createTextNode(displayName(s.meta)));
    }
  }
  if (!shown.length) {
    box.textContent = "";
    el("div", { class: "hint", text: "위의 ‘시리즈 선택’에서 비교할 지표를 골라주세요.", style: "padding:32px 0;text-align:center" }, box);
    return;
  }
  const mmdd = (d) => d.slice(2).replace(/-/g, ".");
  lineChart(box, {
    xLabels: dates.map(mmdd),
    height: 360,
    series: shown.map((s) => ({ label: displayName(s.meta), color: s.color, values: s.values })),
    tooltipTitle: (i) => dates[i],
  });
}

/* ---------- 테이블 ---------- */
function renderCatTabs() {
  const cats = ["ALL", ...new Set(DB.series.map((s) => s.category))];
  const tabs = document.getElementById("catTabs");
  tabs.textContent = "";
  for (const c of cats) {
    const b = el("button", { type: "button", "aria-pressed": String(c === catFilter), text: c === "ALL" ? "전체" : (CAT_LABEL[c] || c) }, tabs);
    b.addEventListener("click", () => { catFilter = c; renderCatTabs(); renderTable(); });
  }
}
function renderTable() {
  const tbody = document.querySelector("#dataTable tbody");
  const q = document.getElementById("tableSearch").value.trim().toLowerCase();
  tbody.textContent = "";
  for (const s of DB.series) {
    if (catFilter !== "ALL" && s.category !== catFilter) continue;
    if (q && !(s.code + " " + s.ticker).toLowerCase().includes(q)) continue;
    const tr = el("tr", null, tbody);
    const name = el("td", null, tr);
    name.appendChild(document.createTextNode(displayName(s)));
    if (!/[가-힣]/.test(s.code)) el("span", { class: "code", text: s.code }, name);
    el("td", { text: s.latest == null ? "–" : fmt(s.latest, 2) + (s.unit === "%" ? "%" : "") }, tr);
    el("td", { text: s.latest_date || "–", style: "color:var(--muted)" }, tr);
    for (const key of ["chg_1d", "chg_1w", "chg_1m", "chg_3m", "chg_ytd", "chg_1y"]) {
      const d = deltaText(s[key], s.chg_unit);
      el("td", { class: d.cls, text: d.txt }, tr);
    }
  }
}

/* ---------- 초기화 ---------- */
function render() {
  renderKpis();
  renderCurveTabs(); renderCurve();
  renderRangeTabs(); renderSeriesPicker(); renderTs();
  renderCatTabs(); renderTable();
}

async function init() {
  const res = await fetch("../data/dashboard_data.json", { cache: "no-store" });
  if (!res.ok) {
    document.getElementById("asof").textContent = "데이터를 불러오지 못했습니다 (data/dashboard_data.json)";
    return;
  }
  DB = await res.json();
  for (const s of DB.series) byId[s.id] = s;
  document.getElementById("asof").textContent =
    `데이터 기준일 ${DB.meta.latest_data_date} · 갱신 ${DB.meta.generated_at.replace("T", " ").replace("Z", " UTC")}`;
  document.getElementById("foot").textContent =
    `${DB.meta.note} 공개 구간: ${DB.meta.public_window_start} ~ ${DB.meta.latest_data_date} · 시리즈 ${DB.meta.series_count}개`;
  // 기본 선택: 국고 3y/10y, UST 10y
  picked = DB.kpis.filter((id) => ["한국_3y", "한국_10y", "UST10y"].includes(byId[id]?.code)).slice(0, 6);
  document.getElementById("pickedHint").textContent = `${picked.length}/6 선택됨`;

  const btn = document.getElementById("pickerBtn");
  const pop = document.getElementById("seriesPop");
  btn.addEventListener("click", () => {
    pop.hidden = !pop.hidden;
    btn.setAttribute("aria-expanded", String(!pop.hidden));
    if (!pop.hidden) renderSeriesPicker();
  });
  document.addEventListener("pointerdown", (e) => {
    if (!pop.hidden && !pop.contains(e.target) && e.target !== btn) {
      pop.hidden = true; btn.setAttribute("aria-expanded", "false");
    }
  });
  document.getElementById("seriesSearch").addEventListener("input", renderSeriesPicker);
  document.getElementById("tableSearch").addEventListener("input", renderTable);

  render();
}
init();
</script>
</body>
