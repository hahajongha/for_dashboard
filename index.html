<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>금융 대시보드 98</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖥️</text></svg>">
<!-- 레트로 한글 비트맵 폰트 (실패해도 시스템 폰트로 대체됨) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.36.0/dist/galmuri.css">
<style>
/* ============================================================
   Windows 98 테마 — 공통 토큰
   ============================================================ */
:root {
  --desktop: #008080;           /* 클래식 청록 바탕화면 */
  --face: #c0c0c0;              /* 크롬(창/버튼) 회색 */
  --face-light: #dfdfdf;
  --face-lighter: #ffffff;
  --face-dark: #808080;
  --face-darker: #0a0a0a;
  --title-active-1: #000080;    /* 활성 제목표시줄 그라데이션 */
  --title-active-2: #1084d0;
  --title-inactive-1: #808080;
  --title-inactive-2: #b5b5b5;
  --sel: #000080;               /* 선택 하이라이트 */
  --font: "Galmuri9", "Galmuri11", Tahoma, "Malgun Gothic", "맑은 고딕", Geneva, sans-serif;
}

/* 볼록(raised) / 오목(sunken) 베벨 — Win98 특유의 2px 입체 테두리 */
.bevel-out {
  box-shadow: inset -1px -1px var(--face-darker), inset 1px 1px var(--face-lighter),
              inset -2px -2px var(--face-dark),  inset 2px 2px var(--face-light);
}
.bevel-in {
  box-shadow: inset -1px -1px var(--face-lighter), inset 1px 1px var(--face-darker),
              inset -2px -2px var(--face-light),   inset 2px 2px var(--face-dark);
}

* { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--desktop);
  font-family: var(--font);
  font-size: 12px; line-height: 1.45;
  color: #000;
  image-rendering: pixelated;
}

/* ============================================================
   바탕화면 + 아이콘
   ============================================================ */
#desktop {
  position: fixed; inset: 0 0 30px 0;  /* 아래 30px은 작업표시줄 */
  padding: 8px 4px;
  display: flex; flex-direction: column; flex-wrap: wrap;
  align-content: flex-start; gap: 2px;
}
.dicon {
  width: 86px; padding: 6px 2px 4px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  cursor: default; border: 1px dotted transparent;
}
.dicon svg { width: 34px; height: 34px; }
.dicon .lbl {
  color: #fff; text-align: center; padding: 1px 3px;
  text-shadow: 1px 1px 0 rgba(0,0,0,.9);
  max-width: 82px; overflow-wrap: break-word;
  word-break: keep-all;  /* 한글 라벨은 어절 단위로 줄바꿈 */
}
.dicon.selected .lbl { background: var(--sel); text-shadow: none; }
.dicon.selected { border-color: rgba(255,255,255,.7); }
.dicon.selected svg { filter: opacity(.75) drop-shadow(0 0 0 rgba(0,0,128,.5)); }

/* ============================================================
   창 (window)
   ============================================================ */
.win {
  position: absolute;
  background: var(--face);
  padding: 3px;
  display: flex; flex-direction: column;
  min-width: 260px; min-height: 140px;
  box-shadow: inset -1px -1px var(--face-darker), inset 1px 1px var(--face-light),
              inset -2px -2px var(--face-dark),  inset 2px 2px var(--face-lighter),
              2px 2px 6px rgba(0,0,0,.35);
}
.win.maxed { left: 0 !important; top: 0 !important; width: 100% !important; height: calc(100% - 30px) !important; }
.win.minimized { display: none; }

.tbar {
  height: 22px; flex: none;
  display: flex; align-items: center; gap: 4px;
  padding: 2px 3px 2px 4px;
  background: linear-gradient(90deg, var(--title-inactive-1), var(--title-inactive-2));
  color: #d5d5d5; cursor: default;
}
.win.active .tbar { background: linear-gradient(90deg, var(--title-active-1), var(--title-active-2)); color: #fff; }
.tbar .ticon { width: 15px; height: 15px; flex: none; }
.tbar .ttl {
  flex: 1; font-weight: 700; font-size: 12px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tbar .tbtn {
  flex: none; width: 18px; height: 16px;
  background: var(--face); color: #000;
  border: 0; padding: 0; font-family: var(--font); font-size: 10px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
  box-shadow: inset -1px -1px var(--face-darker), inset 1px 1px var(--face-lighter),
              inset -2px -2px var(--face-dark),  inset 2px 2px var(--face-light);
}
.tbar .tbtn:active {
  box-shadow: inset 1px 1px var(--face-darker), inset -1px -1px var(--face-lighter),
              inset 2px 2px var(--face-dark),   inset -2px -2px var(--face-light);
}
.wbody {
  flex: 1; min-height: 0; margin-top: 2px;
  background: #fff;
  box-shadow: inset -1px -1px var(--face-lighter), inset 1px 1px var(--face-dark),
              inset -2px -2px var(--face-light),   inset 2px 2px var(--face-darker);
  padding: 2px; overflow: hidden;
}
.wbody iframe { width: 100%; height: 100%; border: 0; background: #fff; }
.wbody .doc { height: 100%; overflow: auto; padding: 12px 14px; user-select: text; -webkit-user-select: text; }
.doc h1 { font-size: 15px; margin: 0 0 10px; }
.doc h2 { font-size: 13px; margin: 14px 0 6px; }
.doc p, .doc li { font-size: 12px; }
.doc code { background: #eee; padding: 0 3px; }
.doc table { border-collapse: collapse; font-size: 12px; }
.doc td, .doc th { border: 1px solid #999; padding: 3px 8px; text-align: left; }

/* 리사이즈 핸들 */
.rsz { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; }
.win.maxed .rsz { display: none; }

/* ============================================================
   작업표시줄 + 시작 메뉴
   ============================================================ */
#taskbar {
  position: fixed; left: 0; right: 0; bottom: 0; height: 30px;
  background: var(--face);
  border-top: 1px solid var(--face-lighter);
  box-shadow: inset 0 1px var(--face-light);
  display: flex; align-items: center; gap: 4px; padding: 3px 4px; z-index: 5000;
}
#startBtn {
  flex: none; height: 24px; padding: 0 8px 0 4px;
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--face); border: 0; font-family: var(--font); font-size: 12px; font-weight: 700;
}
#startBtn svg { width: 17px; height: 17px; }
#startBtn.open, .tkbtn.on {
  box-shadow: inset 1px 1px var(--face-darker), inset -1px -1px var(--face-lighter),
              inset 2px 2px var(--face-dark),   inset -2px -2px var(--face-light);
  background: repeating-conic-gradient(var(--face-light) 0% 25%, var(--face) 0% 50%) 0 0/4px 4px;
}
#tasks { flex: 1; display: flex; gap: 4px; overflow: hidden; }
.tkbtn {
  flex: 0 1 170px; min-width: 44px; height: 24px; padding: 0 6px;
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--face); border: 0; font-family: var(--font); font-size: 12px;
  white-space: nowrap; overflow: hidden;
}
.tkbtn svg { width: 15px; height: 15px; flex: none; }
.tkbtn span { overflow: hidden; text-overflow: ellipsis; }
#tray {
  flex: none; height: 24px; padding: 0 8px;
  display: inline-flex; align-items: center; gap: 6px;
  box-shadow: inset -1px -1px var(--face-lighter), inset 1px 1px var(--face-dark);
  font-size: 12px;
}

#startMenu {
  position: fixed; left: 3px; bottom: 32px; z-index: 6000;
  width: 226px; background: var(--face); padding: 3px;
  display: flex;
}
#startMenu[hidden] { display: none; }
#startMenu .band {
  flex: none; width: 26px; background: linear-gradient(180deg, #1084d0, #000080);
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px;
}
#startMenu .band span {
  writing-mode: vertical-rl; transform: rotate(180deg);
  color: #fff; font-weight: 700; font-size: 15px; letter-spacing: 1px;
}
#startMenu .items { flex: 1; display: flex; flex-direction: column; padding: 2px 0; }
.smi {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 10px 5px 6px; font-size: 12.5px; cursor: default;
}
.smi svg { width: 22px; height: 22px; flex: none; }
.smi:hover { background: var(--sel); color: #fff; }
.smi:hover .lbl { color: #fff; }
.sm-div { height: 0; border-top: 1px solid var(--face-dark); border-bottom: 1px solid var(--face-lighter); margin: 3px 2px; }

/* ============================================================
   시스템 종료 화면
   ============================================================ */
#shutdown {
  position: fixed; inset: 0; z-index: 9000; background: #000;
  display: flex; align-items: center; justify-content: center; text-align: center;
}
#shutdown[hidden] { display: none; }
#shutdown .msg { color: #ff8c1a; font-size: clamp(18px, 4vw, 34px); font-weight: 700; line-height: 1.7; }
#shutdown .sub { color: #666; font-size: 13px; margin-top: 26px; }

/* 모바일: 창은 항상 전체화면 */
@media (max-width: 700px) {
  .win { left: 0 !important; top: 0 !important; width: 100% !important; height: calc(100% - 30px) !important; }
  .rsz, .tbtn[data-act="max"] { display: none; }
  .dicon { width: 76px; }
}
</style>
</head>
<body>

<div id="desktop"></div>

<!-- 작업표시줄 -->
<div id="taskbar">
  <button id="startBtn" class="bevel-out" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" fill="#ff0000"/><rect x="9" y="1" width="6" height="6" fill="#00a300"/><rect x="1" y="9" width="6" height="6" fill="#0078d7"/><rect x="9" y="9" width="6" height="6" fill="#ffb900"/></svg>시작</button>
  <div id="tasks"></div>
  <div id="tray"><span id="clock">--:--</span></div>
</div>

<!-- 시작 메뉴 -->
<div id="startMenu" class="bevel-out" hidden>
  <div class="band"><span>Finance&nbsp;98</span></div>
  <div class="items" id="smItems"></div>
</div>

<!-- 시스템 종료 화면 -->
<div id="shutdown" hidden>
  <div>
    <div class="msg">이제 컴퓨터를<br>끄셔도 안전합니다.</div>
    <div class="sub">아무 곳이나 클릭하면 다시 시작합니다</div>
  </div>
</div>

      <ul>
        <li><code>index.html</code> — 이 바탕화면(런처)</li>
        <li><code>dashboards/kospi_signal.html</code> — KOSPI 시그널 랩 (BOP 매수 · 이격도 매도 신호 검증)</li>
        <li><code>dashboards/kospi_signal_engine.js</code> — 시그널 랩 계산 엔진 (지표·신호·백테스트)</li>
        <li><code>data/kospi_signal.json</code> — KOSPI 일별 시가·고가·저가·종가 (2000년~ 전체 기간, 엑셀 업로드 시 자동 갱신)</li>
        <li><code>investment_model/</code> — TAA 인컴 포트폴리오 (Python 모델 · GitHub Actions 데이터 갱신 · 대시보드)</li>
      </ul>
      <h2>새 대시보드 추가</h2>
      <p><code>dashboards/</code>에 HTML을 추가하고 <code>index.html</code>의
      <code>APPS</code> 배열에 한 항목을 등록하면 아이콘이 생깁니다.</p>`,
  },
  {
    id: "trash", name: "휴지통", icon: "trash",
    type: "doc", desktop: true, startmenu: false, w: 380, h: 260,
    html: `<h1>휴지통</h1><p>휴지통이 비어 있습니다.</p>
           <p style="color:#666">폐기된 대시보드가 여기에 보관될 예정입니다.</p>`,
  },
];

/* ============================================================
   상태
   ============================================================ */
const $ = (s, p) => (p || document).querySelector(s);
const desktop = $("#desktop");
const tasksHost = $("#tasks");
const openWins = new Map();   // appId -> {el, tk, app, maxed}
let zTop = 100;
const isMobile = () => matchMedia("(max-width: 700px)").matches;

/* ============================================================
   바탕화면 아이콘
   ============================================================ */
function renderDesktop() {
  for (const app of APPS) {
    if (!app.desktop) continue;
    const ic = document.createElement("div");
    ic.className = "dicon";
    ic.tabIndex = 0;
    ic.innerHTML = ICONS[app.icon] + `<span class="lbl">${app.name}</span>`;
    ic.addEventListener("click", (e) => {
      document.querySelectorAll(".dicon.selected").forEach((n) => n.classList.remove("selected"));
      ic.classList.add("selected");
      if (isMobile()) openApp(app.id);     // 모바일: 한 번 탭으로 실행
      e.stopPropagation();
    });
    ic.addEventListener("dblclick", () => openApp(app.id));
    ic.addEventListener("keydown", (e) => { if (e.key === "Enter") openApp(app.id); });
    desktop.appendChild(ic);
  }
}
desktop.addEventListener("click", () =>
  document.querySelectorAll(".dicon.selected").forEach((n) => n.classList.remove("selected")));

/* ============================================================
   창 관리자
   ============================================================ */
function openApp(id) {
  const app = APPS.find((a) => a.id === id);
  if (!app) return;
  closeStartMenu();

  // 이미 열려 있으면 복원/포커스
  const ex = openWins.get(id);
  if (ex) { ex.el.classList.remove("minimized"); focusWin(id); return; }

  const win = document.createElement("div");
  win.className = "win";
  const W = Math.min(app.w || 900, innerWidth - 24);
  const H = Math.min(app.h || 600, innerHeight - 70);
  const off = (openWins.size % 5) * 26;
  win.style.width = W + "px";
  win.style.height = H + "px";
  win.style.left = Math.max(6, (innerWidth - W) / 2 + off) + "px";
  win.style.top = Math.max(6, (innerHeight - 30 - H) / 2 + off * 0.6) + "px";

  const newTabBtn = app.type === "iframe"
    ? `<button class="tbtn" data-act="newtab" title="새 탭에서 열기">↗</button>` : "";
  win.innerHTML = `
    <div class="tbar">
      <span class="ticon">${ICONS[app.icon]}</span>
      <span class="ttl">${app.name}</span>
      ${newTabBtn}
      <button class="tbtn" data-act="min" title="최소화">_</button>
      <button class="tbtn" data-act="max" title="최대화">□</button>
      <button class="tbtn" data-act="close" title="닫기">×</button>
    </div>
    <div class="wbody"></div>
    <div class="rsz"></div>`;

  const body = $(".wbody", win);
  if (app.type === "iframe") {
    const f = document.createElement("iframe");
    f.src = app.url;
    f.title = app.name;
    body.appendChild(f);
  } else {
    const doc = document.createElement("div");
    doc.className = "doc";
    doc.innerHTML = app.html;
    body.appendChild(doc);
    if (app.id === "mycomputer") fillMyComputer(doc);
  }

  document.body.appendChild(win);

  // 작업표시줄 버튼
  const tk = document.createElement("button");
  tk.className = "tkbtn bevel-out";
  tk.innerHTML = ICONS[app.icon] + `<span>${app.name}</span>`;
  tk.addEventListener("click", () => {
    const w = openWins.get(id);
    if (!w) return;
    if (w.el.classList.contains("minimized")) { w.el.classList.remove("minimized"); focusWin(id); }
    else if (w.el.classList.contains("active")) { w.el.classList.add("minimized"); refreshTaskbar(); }
    else focusWin(id);
  });
  tasksHost.appendChild(tk);

  openWins.set(id, { el: win, tk, app });

  // 제목표시줄 버튼
  win.addEventListener("mousedown", () => focusWin(id));
  win.addEventListener("touchstart", () => focusWin(id), { passive: true });
  $(".tbar", win).addEventListener("dblclick", (e) => {
    if (!e.target.closest(".tbtn")) toggleMax(id);
  });
  win.querySelectorAll(".tbtn").forEach((b) =>
    b.addEventListener("click", (e) => {
      e.stopPropagation();
      const act = b.dataset.act;
      if (act === "close") closeWin(id);
      else if (act === "min") { win.classList.add("minimized"); refreshTaskbar(); }
      else if (act === "max") toggleMax(id);
      else if (act === "newtab") window.open(app.url, "_blank");
    }));

  makeDraggable(win, $(".tbar", win));
  makeResizable(win, $(".rsz", win));
  if (isMobile()) win.classList.add("maxed");
  focusWin(id);
}

function focusWin(id) {
  for (const [k, w] of openWins) {
    const on = k === id;
    w.el.classList.toggle("active", on);
    if (on) { w.el.style.zIndex = ++zTop; }
  }
  refreshTaskbar();
}
function refreshTaskbar() {
  for (const [, w] of openWins)
    w.tk.classList.toggle("on", w.el.classList.contains("active") && !w.el.classList.contains("minimized"));
}
function closeWin(id) {
  const w = openWins.get(id);
  if (!w) return;
  w.el.remove(); w.tk.remove();
  openWins.delete(id);
  const last = [...openWins.keys()].pop();
  if (last) focusWin(last);
}
function toggleMax(id) {
  const w = openWins.get(id);
  if (!w) return;
  w.el.classList.toggle("maxed");
  $('.tbtn[data-act="max"]', w.el).textContent = w.el.classList.contains("maxed") ? "❐" : "□";
}

/* 드래그 이동 */
function makeDraggable(win, handle) {
  let sx, sy, ox, oy, dragging = false;
  handle.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".tbtn") || win.classList.contains("maxed") || isMobile()) return;
    dragging = true;
    sx = e.clientX; sy = e.clientY;
    ox = win.offsetLeft; oy = win.offsetTop;
    handle.setPointerCapture(e.pointerId);
    win.querySelectorAll("iframe").forEach((f) => (f.style.pointerEvents = "none"));
  });
  handle.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    win.style.left = Math.max(-win.offsetWidth + 80, Math.min(innerWidth - 40, ox + e.clientX - sx)) + "px";
    win.style.top = Math.max(0, Math.min(innerHeight - 60, oy + e.clientY - sy)) + "px";
  });
  const end = () => { dragging = false; win.querySelectorAll("iframe").forEach((f) => (f.style.pointerEvents = "")); };
  handle.addEventListener("pointerup", end);
  handle.addEventListener("pointercancel", end);
}

/* 크기 조절 */
function makeResizable(win, grip) {
  let sx, sy, ow, oh, resizing = false;
  grip.addEventListener("pointerdown", (e) => {
    resizing = true;
    sx = e.clientX; sy = e.clientY;
    ow = win.offsetWidth; oh = win.offsetHeight;
    grip.setPointerCapture(e.pointerId);
    win.querySelectorAll("iframe").forEach((f) => (f.style.pointerEvents = "none"));
    e.preventDefault();
  });
  grip.addEventListener("pointermove", (e) => {
    if (!resizing) return;
    win.style.width = Math.max(260, ow + e.clientX - sx) + "px";
    win.style.height = Math.max(140, oh + e.clientY - sy) + "px";
  });
  const end = () => { resizing = false; win.querySelectorAll("iframe").forEach((f) => (f.style.pointerEvents = "")); };
  grip.addEventListener("pointerup", end);
  grip.addEventListener("pointercancel", end);
}

/* "내 컴퓨터" 내용 채우기 */
function fillMyComputer(doc) {
  const dash = APPS.filter((a) => a.type === "iframe");
  const cnt = $("#appCount", doc);
  if (cnt) cnt.textContent = `대시보드 ${dash.length}개`;
  const ul = $("#appList", doc);
  if (ul) ul.innerHTML = dash.map((a) => `<li>${a.name} — <code>${a.url}</code></li>`).join("");
}

/* ============================================================
   시작 메뉴
   ============================================================ */
const startMenu = $("#startMenu");
const startBtn = $("#startBtn");

function renderStartMenu() {
  const host = $("#smItems");
  let html = "";
  for (const app of APPS) {
    if (!app.startmenu) continue;
    html += `<div class="smi" data-app="${app.id}">${ICONS[app.icon]}<span class="lbl">${app.name}</span></div>`;
  }
  html += `<div class="sm-div"></div>`;
  html += `<div class="smi" data-cmd="shutdown">${ICONS.shutdown}<span class="lbl">시스템 종료...</span></div>`;
  host.innerHTML = html;
  host.querySelectorAll(".smi").forEach((n) =>
    n.addEventListener("click", () => {
      if (n.dataset.app) openApp(n.dataset.app);
      else if (n.dataset.cmd === "shutdown") shutdown();
      closeStartMenu();
    }));
}
function closeStartMenu() { startMenu.hidden = true; startBtn.classList.remove("open"); }
startBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  startMenu.hidden = !startMenu.hidden;
  startBtn.classList.toggle("open", !startMenu.hidden);
});
document.addEventListener("pointerdown", (e) => {
  if (!startMenu.hidden && !startMenu.contains(e.target) && !startBtn.contains(e.target)) closeStartMenu();
});

/* ============================================================
   시계 · 시스템 종료
   ============================================================ */
function tickClock() {
  const d = new Date();
  const h = d.getHours(), m = String(d.getMinutes()).padStart(2, "0");
  $("#clock").textContent = `${h < 12 ? "오전" : "오후"} ${h % 12 || 12}:${m}`;
  $("#tray").title = d.toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
}
setInterval(tickClock, 10000);
tickClock();

function shutdown() {
  for (const id of [...openWins.keys()]) closeWin(id);
  $("#shutdown").hidden = false;
}
$("#shutdown").addEventListener("click", () => location.reload());

/* ============================================================
   초기화
   ============================================================ */
renderDesktop();
renderStartMenu();
</script>
</body>
</html>
